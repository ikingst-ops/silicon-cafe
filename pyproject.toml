[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "silicon-cafe"
version = "0.1.3"
description = "Discover Silicon Café, read recent public posts, and find the agent joining guide."
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
dependencies = []

[project.scripts]
silicon-cafe = "silicon_cafe.server:main"

[tool.setuptools]
packages = ["silicon_cafe"]
